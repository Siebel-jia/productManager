<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>各品类商品销售数据对比</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            background-color: #f9fafb;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .chart-container {
            position: relative;
            height: 400px;
            margin: 0 auto;
        }
        .legend-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
        .legend-label {
            font-size: 14px;
            color: #4b5563;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-gray-100 transition-colors duration-300">
    <!-- 导航栏 -->
    <nav class="fixed top-0 left-0 right-0 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md z-50 border-b border-gray-200 dark:border-gray-500">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-primary-500 flex items-center justify-center">
                    <span class="text-white font-semibold text-sm">J</span>
                </div>
                <span class="font-semibold text-lg">作品集</span>
            </div>
            <div class="flex items-center gap-6">
                <a href="index.html" class="nav-link text-sm text-gray-600 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 transition-colors" data-page="index">首页</a>
                <a href="sales_category_chart.html" class="nav-link text-sm font-medium text-blue-600 dark:text-blue-400" data-page="sales">数据分析可视化</a>
                <a href="2026年1-4月房地产分析报告.html" class="nav-link text-sm text-gray-600 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 transition-colors" data-page="report">文档可视化</a>
                <a href="figma.html" class="nav-link text-sm text-gray-600 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 transition-colors" data-page="figma">Figma前端页面</a>
                <a href="previous_projects.html" class="nav-link text-sm text-gray-600 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 transition-colors" data-page="projects">过往项目</a>
            </div>
        </div>
    </nav>
    <script>
        (function() {
            var currentPage = window.location.pathname.split('/').pop();
            if (currentPage === '' || currentPage === 'index.html') {
                currentPage = 'index';
            } else if (currentPage === 'sales_category_chart.html') {
                currentPage = 'sales';
            } else if (currentPage === '2026年1-4月房地产分析报告.html') {
                currentPage = 'report';
            } else if (currentPage === 'previous_projects.html') {
                currentPage = 'projects';
            } else if (currentPage.includes('figma')) {
                currentPage = 'figma';
            }
            
            var navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(function(link) {
                var page = link.getAttribute('data-page');
                if (page === currentPage) {
                    link.classList.add('text-blue-600', 'dark:text-blue-400', 'font-medium');
                    link.classList.remove('text-gray-600', 'dark:text-gray-300', 'hover:text-primary-600', 'dark:hover:text-primary-400');
                }
            });
        })();
    </script>

    <div class="pt-24">
        <div class="container">
            <h1>各品类商品销售数据对比</h1>
            <p class="subtitle">展示不同商品品类的销售业绩</p>
            
            <div class="chart-container">
                <canvas id="salesChart"></canvas>
            </div>
            
            <div class="legend-container">
                <div class="legend-item"><div class="legend-color" style="background-color: rgba(54, 162, 235, 0.7)"></div><span class="legend-label">手机数码: 71,573</span></div>
                <div class="legend-item"><div class="legend-color" style="background-color: rgba(255, 99, 132, 0.7)"></div><span class="legend-label">电脑办公: 61,601</span></div>
                <div class="legend-item"><div class="legend-color" style="background-color: rgba(255, 206, 86, 0.7)"></div><span class="legend-label">家电厨卫: 37,464</span></div>
                <div class="legend-item"><div class="legend-color" style="background-color: rgba(75, 192, 192, 0.7)"></div><span class="legend-label">服装鞋帽: 26,225</span></div>
                <div class="legend-item"><div class="legend-color" style="background-color: rgba(153, 102, 255, 0.7)"></div><span class="legend-label">美妆护肤: 25,148</span></div>
                <div class="legend-item"><div class="legend-color" style="background-color: rgba(255, 159, 64, 0.7)"></div><span class="legend-label">汽车用品: 21,141</span></div>
                <div class="legend-item"><div class="legend-color" style="background-color: rgba(199, 199, 199, 0.7)"></div><span class="legend-label">母婴用品: 21,000</span></div>
                <div class="legend-item"><div class="legend-color" style="background-color: rgba(83, 102, 255, 0.7)"></div><span class="legend-label">运动户外: 18,565</span></div>
                <div class="legend-item"><div class="legend-color" style="background-color: rgba(255, 99, 255, 0.7)"></div><span class="legend-label">家居日用: 12,649</span></div>
                <div class="legend-item"><div class="legend-color" style="background-color: rgba(99, 255, 132, 0.7)"></div><span class="legend-label">食品零食: 11,385</span></div>
            </div>
        </div>
    </div>
    
    <script>
        const ctx = document.getElementById('salesChart').getContext('2d');
        
        const salesChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ["手机数码", "电脑办公", "家电厨卫", "服装鞋帽", "美妆护肤", "汽车用品", "母婴用品", "运动户外", "家居日用", "食品零食"],
                datasets: [{
                    label: '销售额',
                    data: [71573, 61601, 37464, 26225, 25148, 21141, 21000, 18565, 12649, 11385],
                    backgroundColor: ["rgba(54, 162, 235, 0.7)", "rgba(255, 99, 132, 0.7)", "rgba(255, 206, 86, 0.7)", "rgba(75, 192, 192, 0.7)", "rgba(153, 102, 255, 0.7)", "rgba(255, 159, 64, 0.7)", "rgba(199, 199, 199, 0.7)", "rgba(83, 102, 255, 0.7)", "rgba(255, 99, 255, 0.7)", "rgba(99, 255, 132, 0.7)"],
                    borderColor: ["rgba(54, 162, 235, 1)", "rgba(255, 99, 132, 1)", "rgba(255, 206, 86, 1)", "rgba(75, 192, 192, 1)", "rgba(153, 102, 255, 1)", "rgba(255, 159, 64, 1)", "rgba(199, 199, 199, 1)", "rgba(83, 102, 255, 1)", "rgba(255, 99, 255, 1)", "rgba(99, 255, 132, 1)"],
                    borderWidth: 2,
                    borderRadius: 6,
                    borderSkipped: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0, 0, 0, 0.8)',
                        titleFont: { size: 14 },
                        bodyFont: { size: 13 },
                        padding: 12,
                        cornerRadius: 8,
                        displayColors: true,
                        callbacks: {
                            label: function(context) {
                                return '销售额: ' + context.raw.toLocaleString() + ' 元';
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: {
                            display: false
                        },
                        ticks: {
                            font: {
                                size: 13,
                                weight: '500'
                            },
                            color: '#4b5563'
                        },
                        title: {
                            display: true,
                            text: '商品品类',
                            font: {
                                size: 14,
                                weight: 'bold'
                            },
                            color: '#1f2937'
                        }
                    },
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(0, 0, 0, 0.05)'
                        },
                        ticks: {
                            font: {
                                size: 12
                            },
                            color: '#6b7280',
                            callback: function(value) {
                                return value.toLocaleString() + ' 元';
                            }
                        },
                        title: {
                            display: true,
                            text: '销售额（元）',
                            font: {
                                size: 14,
                                weight: 'bold'
                            },
                            color: '#1f2937'
                        }
                    }
                },
                animation: {
                    duration: 1000,
                    easing: 'easeOutQuart'
                }
            }
        });
    </script>
</body>
</html>
