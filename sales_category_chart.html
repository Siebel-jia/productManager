<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>各品类商品销售数据对比</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .chart-container {
            position: relative;
            height: 400px;
            margin: 0 auto;
        }
        .legend-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
        .legend-label {
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>各品类商品销售数据对比</h1>
        <p class="subtitle">展示不同商品品类的销售业绩</p>
        
        <div class="chart-container">
            <canvas id="salesChart"></canvas>
        </div>
        
        <div class="legend-container">
            <div class="legend-item"><div class="legend-color" style="background-color: rgba(54, 162, 235, 0.7)"></div><span class="legend-label">手机数码: 71,573</span></div><div class="legend-item"><div class="legend-color" style="background-color: rgba(255, 99, 132, 0.7)"></div><span class="legend-label">电脑办公: 61,601</span></div><div class="legend-item"><div class="legend-color" style="background-color: rgba(255, 206, 86, 0.7)"></div><span class="legend-label">家电厨卫: 37,464</span></div><div class="legend-item"><div class="legend-color" style="background-color: rgba(75, 192, 192, 0.7)"></div><span class="legend-label">服装鞋帽: 26,225</span></div><div class="legend-item"><div class="legend-color" style="background-color: rgba(153, 102, 255, 0.7)"></div><span class="legend-label">美妆护肤: 25,148</span></div><div class="legend-item"><div class="legend-color" style="background-color: rgba(255, 159, 64, 0.7)"></div><span class="legend-label">汽车用品: 21,141</span></div><div class="legend-item"><div class="legend-color" style="background-color: rgba(199, 199, 199, 0.7)"></div><span class="legend-label">母婴用品: 21,000</span></div><div class="legend-item"><div class="legend-color" style="background-color: rgba(83, 102, 255, 0.7)"></div><span class="legend-label">运动户外: 18,565</span></div><div class="legend-item"><div class="legend-color" style="background-color: rgba(255, 99, 255, 0.7)"></div><span class="legend-label">家居日用: 12,649</span></div><div class="legend-item"><div class="legend-color" style="background-color: rgba(99, 255, 132, 0.7)"></div><span class="legend-label">食品零食: 11,385</span></div>
        </div>
    </div>
    
    <script>
        const ctx = document.getElementById('salesChart').getContext('2d');
        
        const salesChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ["\u624b\u673a\u6570\u7801", "\u7535\u8111\u529e\u516c", "\u5bb6\u7535\u53a8\u536b", "\u670d\u88c5\u978b\u5e3d", "\u7f8e\u5986\u62a4\u80a4", "\u6c7d\u8f66\u7528\u54c1", "\u6bcd\u5a74\u7528\u54c1", "\u8fd0\u52a8\u6237\u5916", "\u5bb6\u5c45\u65e5\u7528", "\u98df\u54c1\u96f6\u98df"],
                datasets: [{
                    label: '销售额',
                    data: [71573, 61601, 37464, 26225, 25148, 21141, 21000, 18565, 12649, 11385],
                    backgroundColor: ["rgba(54, 162, 235, 0.7)", "rgba(255, 99, 132, 0.7)", "rgba(255, 206, 86, 0.7)", "rgba(75, 192, 192, 0.7)", "rgba(153, 102, 255, 0.7)", "rgba(255, 159, 64, 0.7)", "rgba(199, 199, 199, 0.7)", "rgba(83, 102, 255, 0.7)", "rgba(255, 99, 255, 0.7)", "rgba(99, 255, 132, 0.7)"],
                    borderColor: ["rgba(54, 162, 235, 1)", "rgba(255, 99, 132, 1)", "rgba(255, 206, 86, 1)", "rgba(75, 192, 192, 1)", "rgba(153, 102, 255, 1)", "rgba(255, 159, 64, 1)", "rgba(199, 199, 199, 1)", "rgba(83, 102, 255, 1)", "rgba(255, 99, 255, 1)", "rgba(99, 255, 132, 1)"],
                    borderWidth: 2,
                    borderRadius: 6,
                    borderSkipped: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0, 0, 0, 0.8)',
                        titleFont: { size: 14 },
                        bodyFont: { size: 13 },
                        padding: 12,
                        cornerRadius: 8,
                        displayColors: true,
                        callbacks: {
                            label: function(context) {
                                return '销售额: ' + context.raw.toLocaleString() + ' 元';
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: {
                            display: false
                        },
                        ticks: {
                            font: {
                                size: 13,
                                weight: '500'
                            },
                            color: '#555'
                        },
                        title: {
                            display: true,
                            text: '商品品类',
                            font: {
                                size: 14,
                                weight: 'bold'
                            },
                            color: '#333'
                        }
                    },
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(0, 0, 0, 0.05)'
                        },
                        ticks: {
                            font: {
                                size: 12
                            },
                            color: '#666',
                            callback: function(value) {
                                return value.toLocaleString() + ' 元';
                            }
                        },
                        title: {
                            display: true,
                            text: '销售额（元）',
                            font: {
                                size: 14,
                                weight: 'bold'
                            },
                            color: '#333'
                        }
                    }
                },
                animation: {
                    duration: 1000,
                    easing: 'easeOutQuart'
                }
            }
        });
    </script>
</body>
</html>
