<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figma前端页面 - 贾茗惠作品集</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .iframe-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
        }
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-gray-200 transition-colors duration-300">
    <!-- 导航栏 -->
    <nav class="fixed top-0 left-0 right-0 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md z-50 border-b border-gray-200 dark:border-gray-500">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-primary-500 flex items-center justify-center">
                    <span class="text-white font-semibold text-sm">J</span>
                </div>
                <span class="font-semibold text-lg">作品集</span>
            </div>
            <div class="flex items-center gap-6">
                <a href="index.html" class="nav-link text-sm text-gray-600 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 transition-colors" data-page="index">首页</a>
                <a href="sales_category_chart.html" class="nav-link text-sm text-gray-600 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 transition-colors" data-page="sales">数据分析可视化</a>
                <a href="2026年1-4月房地产分析报告.html" class="nav-link text-sm text-gray-600 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 transition-colors" data-page="report">文档可视化</a>
                <a href="figma.html" class="nav-link text-sm font-medium text-blue-600 dark:text-blue-400" data-page="figma">Figma前端页面</a>
                <a href="previous_projects.html" class="nav-link text-sm text-gray-600 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 transition-colors" data-page="projects">过往项目</a>
            </div>
        </div>
    </nav>
    <script>
        (function() {
            var currentPage = window.location.pathname.split('/').pop();
            if (currentPage === '' || currentPage === 'index.html') {
                currentPage = 'index';
            } else if (currentPage === 'sales_category_chart.html') {
                currentPage = 'sales';
            } else if (currentPage === '2026年1-4月房地产分析报告.html') {
                currentPage = 'report';
            } else if (currentPage === 'previous_projects.html') {
                currentPage = 'projects';
            } else if (currentPage === 'figma.html') {
                currentPage = 'figma';
            }
            
            var navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(function(link) {
                var page = link.getAttribute('data-page');
                if (page === currentPage) {
                    link.classList.add('text-blue-600', 'dark:text-blue-400', 'font-medium');
                    link.classList.remove('text-gray-600', 'dark:text-gray-300', 'hover:text-primary-600', 'dark:hover:text-primary-400');
                }
            });
        })();
    </script>

    <!-- 主内容 -->
    <main class="pt-24 pb-16 px-6">
        <div class="max-w-6xl mx-auto">
            <!-- 页面标题 -->
            <div class="text-center mb-10">
                <h1 class="text-3xl md:text-4xl font-bold mb-4">Figma前端页面</h1>
                <p class="text-gray-600 dark:text-gray-400">展示基于Figma设计稿实现的前端页面效果</p>
            </div>

            <!-- Figma嵌入区域 -->
            <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-gray-200 dark:border-gray-500">
                <h2 class="text-xl font-semibold mb-6 flex items-center">
                    <span class="w-1 h-6 bg-primary-500 rounded-full mr-3"></span>
                    Figma设计稿预览
                </h2>
                <div class="iframe-container">
                    <iframe src="https://siebel-jia.github.io/figma/" title="Figma前端页面"></iframe>
                </div>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-4 text-center">
                    页面内容加载自 https://siebel-jia.github.io/figma/
                </p>
            </div>

            <!-- 项目说明 -->
            <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-gray-200 dark:border-gray-500 mt-6">
                <h2 class="text-xl font-semibold mb-4 flex items-center">
                    <span class="w-1 h-6 bg-primary-500 rounded-full mr-3"></span>
                    项目介绍
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="p-4 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
                        <div class="font-medium text-primary-600 dark:text-primary-400 mb-2">设计工具</div>
                        <div class="text-sm text-gray-600 dark:text-gray-400">Figma</div>
                    </div>
                    <div class="p-4 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
                        <div class="font-medium text-primary-600 dark:text-primary-400 mb-2">技术栈</div>
                        <div class="text-sm text-gray-600 dark:text-gray-400">HTML + CSS + JavaScript</div>
                    </div>
                    <div class="p-4 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
                        <div class="font-medium text-primary-600 dark:text-primary-400 mb-2">响应式</div>
                        <div class="text-sm text-gray-600 dark:text-gray-400">支持移动端和桌面端</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
